# À chaque tag v* : build du wheel, publication PyPI par Trusted Publishing
# (environnement "pypi" déclaré côté PyPI et côté dépôt), release GitHub avec
# des notes générées par git-cliff depuis les commits conventionnels, le wheel
# et le sdist attachés, plus sbom.json (inventaire CycloneDX des composants,
# versions exactes de uv.lock). Wheel et sdist portent deux attestations
# Sigstore : provenance et SBOM. Vérification :
#   gh attestation verify <fichier> --owner amineutron
#
# Le workflow est volontairement autonome : PyPI refuse les jetons OIDC émis
# depuis un workflow réutilisable (claim job_workflow_ref différent du dépôt,
# erreur invalid-publisher, constatée le 2026-09-24).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # certificat Sigstore des attestations
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: uv.lock à jour avec pyproject.toml
        run: uv lock --check
      - run: uv build
      - name: Inventaire des composants (SBOM CycloneDX)
        run: |
          mkdir -p sbom
          uv export --frozen --no-dev --format cyclonedx1.5 -o sbom/sbom.json > /dev/null
      - name: Attestation de provenance (wheel et sdist)
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Attestation SBOM (wheel et sdist)
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          sbom-path: sbom/sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
  publish:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git-cliff lit l'historique jusqu'au tag précédent
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Notes de release (git-cliff, cliff.toml)
        run: uvx git-cliff@2.14.2 --latest --strip all -o RELEASE_NOTES.md
      - name: Release GitHub avec les notes et les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
          gh release upload "${GITHUB_REF_NAME}" dist/* sbom/sbom.json --repo "${GITHUB_REPOSITORY}" --clobber
  # Registre MCP officiel : publie server.json (meme version que le paquet) par
  # OIDC GitHub, sans connexion manuelle. Aussi lancable seul (workflow_dispatch)
  # pour remettre le registre a jour sans refaire de release.
  registry:
    needs: [publish]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      # sha256 de mcp-publisher_linux_amd64.tar.gz v1.8.1, recoupe avec le bundle sigstore publie
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7
      - name: Installer mcp-publisher (version et empreinte figees)
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Connexion au registre (OIDC GitHub)
        run: ./mcp-publisher login github-oidc
      - name: Publier server.json
        run: ./mcp-publisher publish
