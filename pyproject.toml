[project]
name = "mcp-tracking"
version = "0.1.0"
description = "MCP server, HTTP API and Textual TUI dashboard to track long-running tasks in real time"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "amineutron" }]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0",
    "textual>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/amineutron/mcp-tracking"
Repository = "https://github.com/amineutron/mcp-tracking"
Issues = "https://github.com/amineutron/mcp-tracking/issues"

[project.scripts]
mcp-tracking = "server:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools]
py-modules = ["server", "models", "storage", "templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lancer la suite : .venv/bin/python -m pytest
